<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Rounded Base Plate -->
  <rect width="48" height="48" rx="10" fill="#090d16" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Stratum Layer 1 (Base Layer) -->
  <rect x="10" y="29" width="28" height="6" rx="2" fill="#3b82f6" fill-opacity="0.5" stroke="#60a5fa" stroke-width="1.5"/>
  
  <!-- Stratum Layer 2 (Middle Semantic Layer) -->
  <rect x="10" y="21" width="28" height="6" rx="2" fill="#2563eb" fill-opacity="0.8" stroke="#93c5fd" stroke-width="1.5"/>
  
  <!-- Stratum Layer 3 (Top Grounded Layer) -->
  <rect x="10" y="13" width="20" height="6" rx="2" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.5"/>
  
  <!-- Grounding Anchor Node -->
  <circle cx="35" cy="16" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
</svg>
